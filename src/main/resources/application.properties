kz.janapost.dwh-service.clickhouse.enabled=true
kz.janapost.dwh-service.clickhouse.host=${CLICKHOUSE_HOST:185.32.84.48}
kz.janapost.dwh-service.clickhouse.http-port=${CLICKHOUSE_HTTP_PORT:30901}
kz.janapost.dwh-service.clickhouse.native-port=${CLICKHOUSE_NATIVE_PORT:30902}
kz.janapost.dwh-service.clickhouse.database=${CLICKHOUSE_DB:default}
kz.janapost.dwh-service.clickhouse.user=${CLICKHOUSE_USER:default}
kz.janapost.dwh-service.clickhouse.password=${CLICKHOUSE_PASSWORD:DjsLHticnlUxNUL7F9TrAm4sYYixSp}

# Mongo — заглушка: автоконфигурация выключена (см. application-yandex.properties), база ещё не выделена.
# Тестовый хост — как у других сервисов; включить вместе с задачей S2S.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration,\
