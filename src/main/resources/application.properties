# Только локальный запуск. В образе используется /etc/share/application-yandex.properties.
# Секреты сюда не класть: пароли — только переменными окружения (Run Configuration в IntelliJ).
spring.application.name=dwh-service
server.port=8080

kz.janapost.simplelogger.log-dir=./log/simplelogger
kz.janapost.logmanager.enabled=true
kz.janapost.logmanager.controller=/logmanager

springdoc.api-docs.enabled=true

management.endpoints.web.exposure.include=health,prometheus

# Kafka: локально без SASL по умолчанию; для тестового кластера задать KAFKA_* и раскомментировать SASL.
# Локальный docker-compose: для приложений на хосте — localhost:29092 (PLAINTEXT_HOST). Порт 9092 отвечает
# адресом kafka:9092, который с хоста не разрешается без записи в hosts — send() ждёт max.block.ms и падает.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=1
spring.kafka.producer.retries=3
#spring.kafka.properties.security.protocol=SASL_PLAINTEXT
#spring.kafka.properties.sasl.mechanism=SCRAM-SHA-512
#spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required \
#  username="${KAFKA_USERNAME}" \
#  password="${KAFKA_PASSWORD}";

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
# Локальный Redis из docker-compose — с паролем (--requirepass): задать REDIS_PASSWORD в Run Configuration
# (Environment variables). Без него Redis отвечает NOAUTH, и лимитер пропускает все запросы (fail-open).
# Пароль сюда не писать: файл в git.
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=300ms
spring.data.redis.connect-timeout=1s
management.health.redis.enabled=false

# ClickHouse — заглушка: сервис в него пока не ходит. Адрес, порты и доступы тестового кластера —
# только через Run Configuration (CLICKHOUSE_HOST / _HTTP_PORT / _NATIVE_PORT / _USER / _PASSWORD), не в этом файле.
kz.janapost.dwh-service.clickhouse.enabled=true
kz.janapost.dwh-service.clickhouse.host=${CLICKHOUSE_HOST:}
kz.janapost.dwh-service.clickhouse.http-port=${CLICKHOUSE_HTTP_PORT:8123}
kz.janapost.dwh-service.clickhouse.native-port=${CLICKHOUSE_NATIVE_PORT:9000}
kz.janapost.dwh-service.clickhouse.database=${CLICKHOUSE_DB:default}
kz.janapost.dwh-service.clickhouse.user=${CLICKHOUSE_USER:}
kz.janapost.dwh-service.clickhouse.password=${CLICKHOUSE_PASSWORD:}

# Mongo — заглушка: автоконфигурация выключена (см. application-yandex.properties), база ещё не выделена.
# Хост и доступы — через MONGO_* в Run Configuration; включить вместе с задачей S2S.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.mongo.MongoRepositoriesAutoConfiguration
#spring.data.mongodb.host=${MONGO_HOST}
#spring.data.mongodb.port=${MONGO_PORT:30017}
#spring.data.mongodb.database=${MONGO_DB:dwh-service}
#spring.data.mongodb.username=${MONGO_USER}
#spring.data.mongodb.password=${MONGO_PASSWORD}
#spring.data.mongodb.authentication-database=admin

# Эндпоинты для мобильного приложения: локально включены
kz.janapost.dwh-service.mobile.enabled=true
kz.janapost.dwh-service.mobile.public-enabled=true
kz.janapost.dwh-service.mobile.log-topic=event_dwh_log
kz.janapost.dwh-service.mobile.stat-topic=event_dwh_stat
# Локально запросы приходят с localhost: доверяем ему X-Real-IP, чтобы проверять лимит «на IP» curl-ом
kz.janapost.dwh-service.mobile.trusted-proxies=${DWH_TRUSTED_PROXIES:127.0.0.0/8,::1/128}
