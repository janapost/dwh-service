# Только локальный запуск. В образе используется /etc/share/application-yandex.properties.
# Секреты сюда не класть: пароли — только переменными окружения (Run Configuration в IntelliJ).
spring.application.name=dwh-service
server.port=8080

kz.janapost.simplelogger.log-dir=./log/simplelogger
kz.janapost.logmanager.enabled=true
kz.janapost.logmanager.controller=/logmanager

springdoc.api-docs.enabled=true

management.endpoints.web.exposure.include=health,prometheus

# Kafka: локально без SASL по умолчанию; для тестового кластера задать KAFKA_* и раскомментировать SASL.
# Локальный docker-compose: для приложений на хосте — localhost:29092 (PLAINTEXT_HOST). Порт 9092 отвечает
# адресом kafka:9092, который с хоста не разрешается без записи в hosts — send() ждёт max.block.ms и падает.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=1
spring.kafka.producer.retries=3
#spring.kafka.properties.security.protocol=SASL_PLAINTEXT
#spring.kafka.properties.sasl.mechanism=SCRAM-SHA-512
#spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required \
#  username="${KAFKA_USERNAME}" \
#  password="${KAFKA_PASSWORD}";

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
# Локальный Redis из docker-compose — с паролем (--requirepass): задать REDIS_PASSWORD в Run Configuration.
# Без него Redis отвечает NOAUTH, и лимитер пропускает все запросы (fail-open).
spring.data.redis.password=${REDIS_PASSWORD:Ayd6w1XdqBTiUQHST1d4lvOJEt5RtE3Gn}
spring.data.redis.timeout=300ms
spring.data.redis.connect-timeout=1s
management.health.redis.enabled=false

