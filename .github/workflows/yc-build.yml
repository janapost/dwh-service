name: Build Prod Image

on:
  release:
    types: [published]

env:
  ECR_REGISTRY: harbor.janapost.kz/janapost
  ECR_REPOSITORY: ${{ github.event.repository.name }}
  REGISTRY_PASS: ${{ secrets.REGPASS }}
  IMAGE_TAG: "${{ github.ref_name }}"

jobs:
  build:
    name: Build Prod Image
    if: |
      startsWith(github.ref_name, 'yc') &&
      github.event.release.target_commitish == 'main'
    runs-on: janapost-runner
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Build, tag, and push image to Harbor
        run: |
          docker login $ECR_REGISTRY -u github -p $REGISTRY_PASS
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG . -f DockerfileYandex
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
      - name: Trigger workflow with service name and image tag
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.ARGOCD_GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/janapost/argocd/actions/workflows/tag-change.yml/dispatches \
            -d '{"ref":"main", "inputs": {"repo": "'"$ECR_REPOSITORY"'", "tag": "'"$IMAGE_TAG"'"}}'
