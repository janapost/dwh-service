name: CheckStyle

on:
  workflow_dispatch:
  pull_request:

jobs:
  build:
    runs-on: janapost-runner
    name: Build
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.9

      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cp ./settings.xml ~/.m2/settings.xml

      - name: maven build
        run: mvn -B package

      - id: jacoco
        uses: madrapps/jacoco-report@v1.6.1
        if: github.event_name != 'workflow_dispatch'
        with:
          paths: ${{ github.workspace }}/target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 30
          min-coverage-changed-files: 30
          title: Code Coverage
          update-comment: true

  checkstyle:
    name: checkstyle
    runs-on: janapost-runner

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.9

      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cp ./settings.xml ~/.m2/settings.xml

      - name: Checkstyle
        run: mvn -B checkstyle:check