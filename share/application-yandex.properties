spring.application.name=dwh-service
spring.task.scheduling.pool.size=${SCHEDULING_POOL_SIZE:3}

# Simple Logger / Log manager
kz.janapost.simplelogger.log-dir=/opt/share/simplelogger
kz.janapost.logmanager.enabled=true
kz.janapost.logmanager.controller=/logmanager

# Swagger
springdoc.swagger-ui.url=/dwh-service/v3/api-docs
springdoc.swagger-ui.config-url=/dwh-service/v3/api-docs/swagger-config
springdoc.api-docs.enabled=${SWAGGER_ENABLED}

# Metrics
management.server.port=9090
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.metrics.web.server.request.uri-tags-enabled=false
management.prometheus.metrics.export.enabled=true

# Shutdown
server.shutdown=graceful
