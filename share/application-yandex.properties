spring.application.name=dwh-service
spring.task.scheduling.pool.size=${SCHEDULING_POOL_SIZE:3}

# Simple Logger / Log manager
kz.janapost.simplelogger.log-dir=/opt/share/simplelogger
kz.janapost.logmanager.enabled=true
kz.janapost.logmanager.controller=/logmanager

# Swagger
springdoc.swagger-ui.url=/dwh-service/v3/api-docs
springdoc.swagger-ui.config-url=/dwh-service/v3/api-docs/swagger-config
springdoc.api-docs.enabled=${SWAGGER_ENABLED}

# Metrics
management.server.port=9090
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.metrics.web.server.request.uri-tags-enabled=false
management.prometheus.metrics.export.enabled=true

# Shutdown
server.shutdown=graceful

# Kafka. Shared settings (bootstrap, SASL) are used by two producers:
#  - the default Spring Boot KafkaTemplate: the monitoring library (topic_monitoring) - settings as in order-service;
#  - the own producer of the mobile endpoints (kz.janapost.dwh-service.mobile.kafka.*) with strict timeouts.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=1
spring.kafka.producer.retries=3
spring.kafka.properties.security.protocol=SASL_PLAINTEXT
spring.kafka.properties.sasl.mechanism=SCRAM-SHA-512
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required \
  username="${KAFKA_USERNAME}" \
  password="${KAFKA_PASSWORD}";

# Redis (rate limits of mobile endpoints). The limiter is fail-open, so Redis must not turn health DOWN.
# Timeouts: the Lettuce default is 60 s per command - a hung Redis would hold a Tomcat thread that long.
# An unresolved ${VAR} stays a literal string, so optional values need a default ("" = no password).
management.health.redis.enabled=false
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=${REDIS_TIMEOUT:300ms}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:1s}

# ClickHouse - stub: the service does not connect yet (Kafka engine reads topics), see share/clickhouse/README.md
kz.janapost.dwh-service.clickhouse.enabled=${CLICKHOUSE_ENABLED:false}
kz.janapost.dwh-service.clickhouse.host=${CLICKHOUSE_HOST:}
kz.janapost.dwh-service.clickhouse.http-port=${CLICKHOUSE_HTTP_PORT:8123}
kz.janapost.dwh-service.clickhouse.native-port=${CLICKHOUSE_NATIVE_PORT:9000}
kz.janapost.dwh-service.clickhouse.database=${CLICKHOUSE_DB:default}
kz.janapost.dwh-service.clickhouse.user=${CLICKHOUSE_USER:}
kz.janapost.dwh-service.clickhouse.password=${CLICKHOUSE_PASSWORD:}

# Mongo - stub. spring-boot-starter-data-mongodb comes transitively (log-manager -> kz.janapost:util),
# but nothing in dwh-service uses Mongo yet: auto-configuration is excluded, otherwise the service would create
# a MongoClient and a mongo health check (health DOWN without a database). Remove the exclude with the S2S task.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.mongo.MongoRepositoriesAutoConfiguration
#spring.data.mongodb.host=${MONGO_HOST}
#spring.data.mongodb.port=${MONGO_PORT}
#spring.data.mongodb.database=${MONGO_DB}
#spring.data.mongodb.username=${MONGO_USER}
#spring.data.mongodb.password=${MONGO_PASSWORD}
#spring.data.mongodb.authentication-database=admin

# Mobile endpoints (/client/v1/log|stat/add-batch, /public/v1/log/add-batch)
kz.janapost.dwh-service.mobile.enabled=${DWH_MOBILE_ENABLED:false}
kz.janapost.dwh-service.mobile.public-enabled=${DWH_MOBILE_PUBLIC_ENABLED:false}
kz.janapost.dwh-service.mobile.log-topic=${DWH_LOG_TOPIC:event_dwh_log}
kz.janapost.dwh-service.mobile.stat-topic=${DWH_STAT_TOPIC:event_dwh_stat}
kz.janapost.dwh-service.mobile.max-items=${DWH_MOBILE_MAX_ITEMS:100}
kz.janapost.dwh-service.mobile.public-max-items=${DWH_MOBILE_PUBLIC_MAX_ITEMS:20}
kz.janapost.dwh-service.mobile.max-body-bytes=${DWH_MOBILE_MAX_BODY_BYTES:524288}
kz.janapost.dwh-service.mobile.public-max-body-bytes=${DWH_MOBILE_PUBLIC_MAX_BODY_BYTES:65536}
# kafka-send-timeout-ms (batch deadline) > kafka.delivery-timeout-ms >= linger-ms + request-timeout-ms - checked at startup
kz.janapost.dwh-service.mobile.kafka-send-timeout-ms=${DWH_MOBILE_KAFKA_TIMEOUT_MS:6000}
kz.janapost.dwh-service.mobile.kafka.acks=all
kz.janapost.dwh-service.mobile.kafka.idempotence=${KAFKA_PRODUCER_IDEMPOTENCE:true}
kz.janapost.dwh-service.mobile.kafka.max-block-ms=${DWH_MOBILE_KAFKA_MAX_BLOCK_MS:2000}
kz.janapost.dwh-service.mobile.kafka.delivery-timeout-ms=${DWH_MOBILE_KAFKA_DELIVERY_TIMEOUT_MS:5000}
kz.janapost.dwh-service.mobile.kafka.request-timeout-ms=${DWH_MOBILE_KAFKA_REQUEST_TIMEOUT_MS:3000}
kz.janapost.dwh-service.mobile.kafka.linger-ms=${DWH_MOBILE_KAFKA_LINGER_MS:5}
# device clock outside [now - age, now + ahead] -> server time; original goes to attributes/tags.clientTimestamp
kz.janapost.dwh-service.mobile.max-client-timestamp-age-days=${DWH_MOBILE_MAX_TS_AGE_DAYS:30}
kz.janapost.dwh-service.mobile.max-client-timestamp-ahead-ms=${DWH_MOBILE_MAX_TS_AHEAD_MS:86400000}
kz.janapost.dwh-service.mobile.rate-limit.enabled=${DWH_MOBILE_RL_ENABLED:true}
kz.janapost.dwh-service.mobile.rate-limit.per-user-max-requests=${DWH_MOBILE_RL_USER_MAX:30}
kz.janapost.dwh-service.mobile.rate-limit.per-user-window-seconds=${DWH_MOBILE_RL_USER_WINDOW:60}
kz.janapost.dwh-service.mobile.rate-limit.per-ip-max-requests=${DWH_MOBILE_RL_IP_MAX:20}
kz.janapost.dwh-service.mobile.rate-limit.per-ip-window-seconds=${DWH_MOBILE_RL_IP_WINDOW:60}
kz.janapost.dwh-service.mobile.rate-limit.per-device-max-requests=${DWH_MOBILE_RL_DEVICE_MAX:10}
kz.janapost.dwh-service.mobile.rate-limit.per-device-window-seconds=${DWH_MOBILE_RL_DEVICE_WINDOW:60}
kz.janapost.dwh-service.mobile.rate-limit.global-max-requests=${DWH_MOBILE_RL_GLOBAL_MAX:2000}
kz.janapost.dwh-service.mobile.rate-limit.public-global-max-requests=${DWH_MOBILE_RL_PUBLIC_GLOBAL_MAX:300}
kz.janapost.dwh-service.mobile.rate-limit.global-window-seconds=1
kz.janapost.dwh-service.mobile.rate-limit.global-retry-after-seconds=${DWH_MOBILE_RL_GLOBAL_RETRY_AFTER:30}
# after a Redis error the limiter does not touch Redis for this long (requests pass without limits, one log line)
kz.janapost.dwh-service.mobile.rate-limit.redis-cooldown-ms=${DWH_MOBILE_RL_REDIS_COOLDOWN_MS:10000}
